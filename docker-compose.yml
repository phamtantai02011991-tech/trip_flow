version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: tripflow_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tripflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripflow_backend_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tripflow
      SECRET_KEY: ${SECRET_KEY:-tripflow_production_super_secret_jwt_key_2026}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      GOONG_MAPTILES_KEY: ${GOONG_MAPTILES_KEY:-}
      GOONG_BASE_URL: https://rsapi.goong.io
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORRIDOR_RATE_LIMIT: 10/minute
      MAPS_DAILY_BUDGET_LIMIT: 1000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  admin-web:
    image: node:20-alpine
    container_name: tripflow_admin_web
    working_dir: /app
    volumes:
      - ./admin-web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
