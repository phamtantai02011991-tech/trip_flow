services:
  db:
    image: postgres:15-alpine
    container_name: tripflow_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-tripflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tripflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Không mở cổng DB ra ngoài ở production.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripflow_backend_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-tripflow};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${SECRET_KEY:?Bắt buộc đặt SECRET_KEY ngẫu nhiên}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tripflow.vn}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@TripFlow2026!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEV_OTP_ENABLED: "0"
      SMS_PROVIDER: ${SMS_PROVIDER:-esms}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      ESMS_BRANDNAME: ${ESMS_BRANDNAME:-TripFlow}
      ENABLE_GOOGLE_CRAWLER: ${ENABLE_GOOGLE_CRAWLER:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      GOONG_MAPTILES_KEY: ${GOONG_MAPTILES_KEY:-}
      GOONG_BASE_URL: https://rsapi.goong.io
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORRIDOR_RATE_LIMIT: 10/minute
      MAPS_DAILY_BUDGET_LIMIT: ${MAPS_DAILY_BUDGET_LIMIT:-1000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEMO_MODE: "false"
    container_name: tripflow_admin_web
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Flutter web đã build sẵn (build/web). Phục vụ tĩnh, dùng cho demo/local.
  app-web:
    image: nginx:1.27-alpine
    container_name: tripflow_app_web
    restart: unless-stopped
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./deploy/app-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
